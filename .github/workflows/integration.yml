# Intégration : ce qui entre dans `develop`.
#
# Le déclencheur est la **poussée sur `develop`**, parce que c'est ainsi que ce dépôt
# travaille : une branche de lot, la fusion en local, puis `git push origin develop`.
#
# **Rien n'est publié** : ce travail construit l'image pour vérifier qu'elle se construit
# encore, et s'arrête là. Seule une étiquette de version (`production.yml`) pousse une
# image sur GHCR — sans quoi chaque poussée encombrerait les paquets du dépôt.
name: Check Integration Image

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  qualite:
    uses: ./.github/workflows/_quality.yml

  image:
    name: Construction de l'image
    needs: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Environnement GitHub `integration` : il garde ses secrets et ses règles, mais
    # n'annonce plus d'URL, puisqu'aucune image n'est publiée.
    environment:
      name: integration

    permissions:
      contents: read

    steps:
      # On construit exactement le commit poussé sur `develop`.
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
